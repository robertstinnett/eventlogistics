{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card" style="max-width:560px; margin:0 auto;">
    <p class="eyebrow">Welcome Back</p>
    <h2 class="auth-title">Sign in to run your next great event</h2>
    <p class="auth-subtitle">Access your events, participants, inventory, and billing from one operations hub.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign In</button>
      <a class="btn btn-secondary" href="/accounts/register/">Create Account</a>
    </form>
  </div>
</div>
{% endblock %}
